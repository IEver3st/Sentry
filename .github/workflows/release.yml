name: Release Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      SENTRY_RELEASE_REPOSITORY: ${{ vars.SENTRY_RELEASE_REPOSITORY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.6'
      - name: Validate destination and version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-config.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $repo = gh api "repos/$env:GITHUB_REPOSITORY" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($repo.private -or $repo.archived) { throw 'The update feed requires an active public repository.' }
      - run: bun install --frozen-lockfile
      - name: Check source and release configuration
        run: |
          bun run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run test:google
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run test:performance
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run test:notifications
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/release-config.test.mjs tests/release-assets.test.mjs
      - run: bun run build
      - run: bun run test:scan
      - run: bun run test:window
      - name: Package Windows x64 without publishing
        run: bun x --no-install electron-builder --config dist/release-builder.json --win nsis --x64 --publish never
      - name: Verify installer and embedded update feed
        run: node scripts/verify-release.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: dist/release-assets/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-notes
          path: docs/release-notes/${{ github.ref_name }}.md
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release
          path: release-assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-notes
          path: release-notes
      - name: Publish verified assets
        shell: bash
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS.txt
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft > ../release.json 2>/dev/null; then
            test "$(jq -r .isDraft ../release.json)" = true || { echo 'Refusing to replace a published release.'; exit 1; }
          else
            flags=()
            if [[ "$RELEASE_TAG" == *-beta.* ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --notes-file "../release-notes/$RELEASE_TAG.md" --title "Sentry $RELEASE_TAG" "${flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" ./* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url,assets,isDraft,isPrerelease
      - name: Read back the public update manifest
        shell: bash
        working-directory: release-assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          manifest=latest.yml
          if [[ "$RELEASE_TAG" == *-beta.* ]]; then manifest=beta.yml; fi
          curl --fail --location --retry 5 --retry-all-errors --output ../published.yml "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$manifest"
          cmp "$manifest" ../published.yml
          curl --fail --location --retry 5 --retry-all-errors --output ../published-checksums.txt "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/SHA256SUMS.txt"
          cmp SHA256SUMS.txt ../published-checksums.txt
